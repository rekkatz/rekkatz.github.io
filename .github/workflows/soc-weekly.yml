name: SOC Weekly

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Número de días a analizar"
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: soc-weekly
  cancel-in-progress: false

jobs:
  validate-workflow:
    name: Validar configuración SOC Weekly
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar estado del proyecto
        run: |
          echo "SOC Weekly está configurado correctamente."
          echo "El generador de artículos y portadas todavía no está habilitado."
          echo "Días solicitados: ${{ inputs.days || '7' }}"
